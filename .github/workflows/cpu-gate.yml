name: cpu-gate

# The repository's own gate. scripts/check_kernel_cpu.sh runs the shipped kernel
# bodies through the CPU shim -- real kernel code on host memory -- plus the
# public-API tests and the external edlib comparison. It needs NO GPU: the
# device-dependent stages skip cleanly on a runner without one and say so.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install the edlib oracle (optional dep; gate degrades loudly without it)
        run: pip install edlib

      - name: Run the CPU gate
        run: bash scripts/check_kernel_cpu.sh
